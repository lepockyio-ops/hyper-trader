# 复制为 config/settings.toml 后修改。这里不放任何密钥（密钥只走环境变量）。
# 所有阈值均为手册中的“示例值”或“用户设定”，未经数据验证。

[runtime]
network = "testnet"        # testnet | mainnet（主网还需 HL_ALLOW_MAINNET，见 s03/config.py）
mode = "shadow"            # shadow：不下单，用主网行情模拟成交 | live：向 network 发送订单
scan_interval_min = 15
scan_delay_sec = 5
action_expires_sec = 10

[strategy]
# 策略插件（"模块:类名"）。默认是空白模板：框架能运行，但不会产生任何入场。
#   空白模板：s03.strategies.template:BlankStrategy
#   示例策略（只用于验证框架）：s03.strategies.examples.sma_cross:SmaCrossExample
#   你的策略：复制 s03/strategies/template.py，例如 s03.strategies.my_strategy:MyStrategy
plugin = "s03.strategies.template:BlankStrategy"
coins = ["BTC", "ETH", "SOL", "BNB", "HYPE"]   # 示例标的，按你的策略修改
entry_impl = "A"                       # A：突破触发单 | B：收盘确认后限价
stop_min_pct = 0.8                     # 框架止损护栏（示例值）
stop_max_pct = 3.0
stop_min_mode = "skip"                 # skip：止损太近就放弃 | floor：改为入场价下方 stop_min_pct
max_hold_days = 30                     # 框架强制的最长持有天数（示例值）
# 宏观事件（UTC）：事件文件由 s03-events 从官方日程生成，可再手工补充
event_times_utc = []
event_file = "/var/lib/s03-events/events.json"   # 本地调试可设为 ""
# BlockBeats 新闻事件守卫（可选，只收紧）：按币种暂停新开仓。由 s03-news 定时器生成；"" = 不启用
news_file = ""                         # 启用时设为 "/var/lib/s03-news/news_blocks.json"
news_venue = "hyperliquid"
news_max_age_min = 30                  # 文件超过这么久没更新就忽略它（不会卡住交易），并记日志

[strategy.params]
# 你的策略参数，在插件里用 self.p("名字", 默认值) 读取。示例策略可用：
# trend_len = 50
# fast_len = 20
# tp_r = 2.0
# tp_frac = 0.5

[risk]
risk_per_trade = 0.005          # 来自你的描述
max_open_risk = 0.015
max_positions = 3
max_account_leverage = 30.0     # 用户设定
max_position_leverage = 30      # 用户设定；实际还受“强平距离 ≥ 3 倍止损距离”公式约束
liq_to_stop_multiple = 3.0
daily_loss_halt = 0.02          # 系统故障保护，可删除
weekly_loss_halt = 0.04         # 系统故障保护，可删除
consecutive_loss_pause = 6

[cost]
taker_fee = 0.00045
maker_fee = 0.00015
slippage = 0.0003
funding_per_hour_est = 0.0000125

[ml]
enabled = false            # 第 14 节：只有在你批准模型、并重新通过 G2–G8 后才改为 true
train_period_days = 365
test_period_days = 90
purge_days = 30
min_events = 300
take_threshold = 0.5
reduced_scale = 0.5        # 只能 ≤ 1：机器学习只降低风险，不放大仓位
outlier_method = "svm"

[alerts]
# 告警阈值（全部为示例值，需用回测与影子模式数据校准）
shock_sigma = 4.0          # |1 分钟收益| > 4 × 近 24 小时标准差
range15_atr_mult = 2.0     # 15 分钟振幅 > 2 × ATR(14)
near_stop_r = 0.3          # 距离止损 < 0.3R
stop_missing_grace_s = 20  # 有持仓无止损持续 20 秒
funding_pctile = 0.95
ref_dev_pct = 0.3          # 与 OKX 价差 > 0.3%
feed_stale_s = 30
cooldown_s = 900           # 同一标的同一规则 15 分钟冷却
max_llm_per_hour = 6       # 每小时最多转给 OpenClaw 6 次（critical 不占额度）

[openclaw]
enabled = false            # 配好 OpenClaw hooks 并测试后再改为 true；token 用环境变量 OPENCLAW_HOOKS_TOKEN
url = "http://127.0.0.1:18789/hooks/agent"   # 以你的 gateway 地址与 hooks.path 为准
agent_id = "s03-analyst"   # 须在 OpenClaw 的 hooks.allowedAgentIds 中；建议只读、无执行工具
deliver = true
venue = "Hyperliquid"
